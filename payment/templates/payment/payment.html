{% extends "users/base.html" %}
{% block title %}Payment Page{% endblock title %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4 text-primary">Confirm Your Payment</h2>
        <p class="text-center mb-3">You're about to make a payment of <strong>{{ amount }} Tk</strong></p>

        <form method="POST">
            {% csrf_token %}
            <div class="text-center">
                <button type="submit" class="">Proceed to Pay</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
