{% extends "users/base.html" %}
{% block title %}Purchase Successful{% endblock title %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  .success-container {
    max-width: 600px;
    margin: 50px auto;
    padding: 40px 50px;
    background-color: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    text-align: center;
    font-family: 'Poppins', sans-serif;
  }

  .success-container h1 {
    color: #4caf50;
    font-size: 36px;
    margin-bottom: 20px;
  }

  .book-details {
    margin: 20px 0;
    font-size: 18px;
  }

  .book-details span {
    font-weight: 600;
    color: #6a1b9a;
  }

  a.button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 30px;
    background: linear-gradient(to right, #7b1fa2, #4caf50);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 18px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  a.button:hover {
    background: linear-gradient(to right, #6a1b9a, #388e3c);
    transform: translateY(-2px);
  }
</style>

<div class="success-container">
  <h1>Purchase Successful!</h1>
  <div class="book-details">
    <p><strong>Book:</strong> <span>{{ book.name }}</span></p>
    <p><strong>Author:</strong> <span>{{ book.author }}</span></p>
    <p><strong>Price:</strong> <span>{{ book.price }} ৳</span></p>
  </div>
  <a href="{% url 'sell-book-list' %}" class="button">Back to Books</a>
  <a href="{% url 'users-profile' %}" class="button" style="margin-left:10px;">Go to Profile</a>
</div>
{% endblock %}
